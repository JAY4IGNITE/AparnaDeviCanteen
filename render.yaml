services:
  # 1. Node.js Backend (Web Service)
  - type: web
    name: aparnadevicanteen-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false # Render will prompt you for this value during deployment
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Render will prompt you for this value during deployment
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure secret

  # 2. React/Vite Frontend (Static Site)
  - type: web
    name: aparnadevicanteen-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aparnadevicanteen-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
